# Function gateway ayarlari. ai-ask-spike anonim erisimlidir: client Authorization
# gondermez, fonksiyon kendi cift kademeli limitini uygular. verify_jwt asla acilmamali;
# 2026-08-18'de bayraksiz bir deploy bunu varsayilana dondurup canli Spike'i kirdi.
project_id = "zerospike"

[functions.ai-ask-spike]
verify_jwt = false

# track: app JWT gondermez, cihaz basina limit fonksiyonun icinde (ai-ask-spike gibi).
[functions.track]
verify_jwt = false

# rc-webhook: RevenueCat kendi Authorization degerini yollar (RC_WEBHOOK_SECRET), JWT degil.
[functions.rc-webhook]
verify_jwt = false

# delete-device: app JWT gondermez, cihaz basina limit fonksiyonun icinde (track gibi).
[functions.delete-device]
verify_jwt = false

# feedback: app JWT gondermez, kurulum ve IP basina limit fonksiyonun icinde (delete-device gibi).
[functions.feedback]
verify_jwt = false
